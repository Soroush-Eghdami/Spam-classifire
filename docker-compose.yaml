name: sift

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: sift-backend:latest
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-dev-key-change-me}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      DB_PATH: /app/data/db.sqlite3
      MODEL_PATH: /app/ml/artifacts/spam_pipeline.joblib
      METRICS_PATH: /app/ml/artifacts/metrics.json
      MAX_BATCH_ROWS: ${MAX_BATCH_ROWS:-500}
      MAX_BATCH_FILE_MB: ${MAX_BATCH_FILE_MB:-5}
    volumes:
      - sift-data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    image: sift-frontend:latest
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sift-data:
